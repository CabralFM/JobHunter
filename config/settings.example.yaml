# Copie para config/settings.yaml e ajuste. Segredos NUNCA aqui: use variáveis de ambiente
# (ANTHROPIC_API_KEY, APIFY_TOKEN, SMTP_PASSWORD) — ver .env.example.

candidates: [eu, esposa]          # nomes das pastas em config/candidates/
data_dir: data

search:
  max_age_days: 7          # só anúncios publicados nos últimos 7 dias
  max_terms_per_candidate: 15
  locations:
    # Busca por PAÍS inteiro (name vazio). A prioridade da Suíça romanda é dada na nota de
    # "desejo" (profile.yaml -> location_preference), não restringindo a busca.
    # Para buscar por cidade: - {name: "Lausanne", country: CH}
    - {name: "", country: CH}
    - {name: "", country: LU}

sources:
  jobspy:
    enabled: true
    # LinkedIn bloqueia (erro 429) a busca sem login a partir de IPs residenciais, e o Google Jobs
    # parou de responder ao JobSpy (teste de 25.11.2026). Para religar: [linkedin, indeed, google]
    sites: [indeed]
    results_wanted: 50                  # por termo e país
    linkedin_fetch_description: true    # mais lento, mas sem descrição não há match bom
    proxies: null
  linkedin:
    # Busca pública do LinkedIn (sem login). Se bloquear, usa o Apify (apify_fallback) se
    # houver APIFY_TOKEN no .env. Opcional: LINKEDIN_PROXY=http://usuario:senha@host:porta no .env.
    enabled: true
    max_pages: 2                    # 25 vagas por página, por termo e país
    delay_seconds: [4.0, 8.0]       # pausa aleatória entre pedidos (ritmo humano; menos 429)
    backoff_seconds: [30, 90, 180]  # esperas antes de desistir quando o LinkedIn devolve 429
    max_details_per_run: 200        # descrições baixadas por execução
    apify_fallback:
      # Actor do Apify para LinkedIn (usa proxies próprios). VERIFICAR o formato de entrada na
      # aba "Input" do actor no primeiro uso; {linkedin_search_url} = busca do termo no país.
      actor: "curious_coder/linkedin-jobs-scraper"
      input_template: {"urls": ["{linkedin_search_url}"], "count": 50, "scrapeCompany": false}
      countries: [CH, LU]
  sites:
    # Sites lidos pelo "cartão de vaga" JSON-LD de cada anúncio (o mesmo que o Google Jobs usa).
    # search_url: abra o site, faça uma busca por "data analyst" e copie a URL da barra de
    # endereço, trocando o termo por {query}. link_regex: padrão do endereço dos anúncios.
    moovijob:
      enabled: true
      # índice com todos os anúncios + data; filtra pelos últimos max_age_days e pelo termo
      sitemap_url: "https://www.moovijob.com/sitemap-joboffers"
      link_regex: "moovijob\\.com/offres-emploi/[^/?#]+/[^/?#]+$"
      countries: [LU]
      max_links_per_search: 30
    jobs_lu:
      enabled: false   # desligado até confirmarmos o formato do endereço dos anúncios
      search_url: "https://en.jobs.lu/{query_slug}-jobs"   # ex.: en.jobs.lu/data-analyst-jobs
      link_regex: "jobs\\.lu/[^?#]*[0-9]{5,}"           # anúncios têm um número longo no endereço (a confirmar)
      countries: [LU]
      max_links_per_search: 30
  jobs.ch:
    enabled: true
    rows: 20
    max_pages: 1
    delay_seconds: 0.7
  jobup.ch:
    enabled: true
    rows: 20
    max_pages: 1
    delay_seconds: 0.7
  apify: {}                            # actors extras do Apify (opcional, ver apify_source.py)
prefilter:
  min_description_chars: 200
  exclude_title_patterns:            # regex, sem LLM, custo zero
    - "\\b(stagiaire|stage|internship|praktikum|apprenti|lehrstelle|werkstudent)\\b"

# Pesos das dimensões (soma = 1). Ajuste depois de 2 semanas olhando o feedback.
weights:
  hard_skills: 0.30
  experience: 0.20
  domain: 0.15
  languages: 0.15
  location_permit: 0.10
  education: 0.10

thresholds:
  apply_min_potential: 72   # gera CV/carta e põe na fila (ou envia, no modo email)
  apply_min_desire: 60      # e a vaga tem que ser algo que você QUER
  review_min_potential: 58  # aparece no relatório para você decidir

limits:                       # teto de chamadas: o que passar fica para o dia seguinte
  max_triage_per_day: 250
  max_assess_per_day: 40

budget:
  monthly_usd: 5.0            # teto de gasto na API por mês; atingiu, para até o mês seguinte

llm:
  # Modo econômico: tudo no Claude Haiku 5.5 (US$ 0,10 / 0,50 por milhão de tokens, ~40x mais
  # barato que o Opus 5.5). Custo estimado: US$ 3-5 por mês para os dois candidatos.
  # Para um texto melhor só nas vagas que valem: retailor <id> <candidato> --model claude-sonnet-5-5
  # Para voltar à qualidade máxima (e ~US$ 100+/mês): claude-opus-5-5 nas etapas.
  expand: {model: claude-haiku-5-5, effort: medium}
  triage: {model: claude-haiku-5-5, effort: low}
  assess: {model: claude-haiku-5-5, effort: medium}
  tailor: {model: claude-haiku-5-5, effort: high}
  verify: {model: claude-haiku-5-5, effort: medium}

apply:
  mode: queue                     # queue | email
  dry_run: true                   # no modo email: true = só simula (comece assim!)
  max_per_candidate_per_day: 5    # qualidade > quantidade
  smtp:
    host: smtp.gmail.com          # Gmail: use "senha de app", não a senha normal
    port: 587
    from: "seu.email@exemplo.com"
    password_env: SMTP_PASSWORD
    bcc_self: true
